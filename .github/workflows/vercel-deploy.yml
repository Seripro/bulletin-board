name: Deploy to Vercel

# mainブランチにpushをトリガーにする
on:
  push:
    branches:
      - main
  workflow_dispatch:

# ジョブを定義
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v3 # リポジトリのコードをクローンする

      - name: Set up Node.js
        uses: actions/setup-node@v3 # node.jsをセットアップする
        with:
          node-version: "20" # nodeのバージョン20を指定

      - name: Install dependencies
        run: npm install # 依存関係をインストール

      - name: Deploy to Vercel
        run: |
          npx vercel --prod \
          --token ${{ secrets.VERCEL_TOKEN }} \
          --yes \
          --build-env NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
          --build-env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        env:
          orgId: ${{ secrets.VERCEL_TEAM_ID }}
          projectId: ${{ secrets.VERCEL_PROJECT_ID }}
